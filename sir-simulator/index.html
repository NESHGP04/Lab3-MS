<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>SIR Simulator</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <h1>Simulador Interactivo del Modelo SIR</h1>

    <div class="controls">

        <!-- R0 -->
        <div class="control">
            <label for="r0">
                R₀:
                <span id="r0Value">2.8</span>
            </label>

            <input
                type="range"
                id="r0"
                min="0.5"
                max="5.0"
                step="0.1"
                value="2.8"
            >
        </div>


        <!-- Período infeccioso -->
        <div class="control">
            <label for="infectiousPeriod">
                Período infeccioso:
                <span id="periodValue">7</span> días
            </label>

            <input
                type="range"
                id="infectiousPeriod"
                min="3"
                max="21"
                step="1"
                value="7"
            >
        </div>


        <!-- Fracción inicial infectada -->
        <div class="control">
            <label for="initialFraction">
                Fracción inicial infectada I(0)/N:
                <span id="fractionValue">0.002</span>
            </label>

            <input
                type="range"
                id="initialFraction"
                min="0.001"
                max="0.05"
                step="0.001"
                value="0.002"
            >
        </div>

    </div>


    <canvas id="sirChart"></canvas>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="js/app.js"></script>

</body>

</html>
